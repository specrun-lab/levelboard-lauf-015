name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/specrun-lab/devcontainer:1
      options: --user root
    env:
      GOMODCACHE: /home/dev/go/pkg/mod
      GOCACHE: /home/dev/.cache/go-build
      GOFLAGS: -modcacherw -buildvcs=false
      RUN_ID: lauf-015
    steps:
      - uses: actions/checkout@v7
      - run: make level5
      - run: make check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: levelboard-report
          path: |
            frontend/dist/results.json
            checks/.out/playwright.json

  images:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}
      IMAGE_TAG: ${{ github.sha }}
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: |
          cd checks
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test tests/container.spec.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: levelboard-container-report
          path: checks/.out/playwright.json
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          docker compose push
          docker tag "$IMAGE_PREFIX-frontend:$IMAGE_TAG" "$IMAGE_PREFIX-frontend:main"
          docker tag "$IMAGE_PREFIX-backend:$IMAGE_TAG" "$IMAGE_PREFIX-backend:main"
          docker push "$IMAGE_PREFIX-frontend:main"
          docker push "$IMAGE_PREFIX-backend:main"
      - if: always()
        run: docker compose down -v
